# secrets_template.toml — copy the keys you need into Streamlit Community
# Cloud's "Secrets" box (App settings → Secrets) after deploying.
# NEVER commit an actual .streamlit/secrets.toml — it's gitignored on purpose.

# ── Breeze (ICICI Direct) API — required for live data / predictions ─────────
# Session token expires daily; you'll need to refresh it here (or in the app's
# Settings tab, which only persists until the container restarts) each morning.
BREEZE_API_KEY = "YOUR_API_KEY_HERE"
BREEZE_API_SECRET = "YOUR_API_SECRET_HERE"
BREEZE_SESSION_TOKEN = ""

# ── Optional: GNews API for news-sentiment enrichment ─────────────────────────
GNEWS_API_KEY = ""

# ── Access control — restrict who can open the deployed app ──────────────────
# Comma-separated list of Google emails allowed in (used by Google sign-in
# below, and also checked if you fall back to password auth).
ALLOWED_EMAILS = "you@example.com"

# Override the built-in password-fallback credentials (defaults in app.py are
# public in this repo's source — do NOT rely on them for a public deployment).
# AUTH_USERNAME = "choose-a-username"
# AUTH_PASSWORD_SHA256 = "sha256-hex-of-your-password"

# ── Optional: Google native sign-in (preferred over password fallback) ───────
# One-time setup: console.cloud.google.com -> new project -> APIs & Services
# -> Credentials -> Create OAuth client ID -> Web application.
# Authorized redirect URI: https://<your-app>.streamlit.app/oauth2callback
# (and https://youdomain.com/oauth2callback too, once forwarding is set up)
# [auth]
# redirect_uri = "https://<your-app>.streamlit.app/oauth2callback"
# cookie_secret = "any-long-random-string"
# client_id = "xxxxxxx.apps.googleusercontent.com"
# client_secret = "xxxxxxx"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

# ── Optional: trading-parameter overrides (else config.py defaults are used) ─
# CAPITAL = 20000
# MIN_CONFIDENCE = 0.70
# TARGET_PCT = 0.80
# SL_PCT = 0.30
# MAX_VIX = 25.0
